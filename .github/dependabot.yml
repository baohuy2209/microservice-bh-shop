version: 2
updates:
  # Maintain dependencies for pnpm monorepo (Node.js / npm packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      core-frameworks:
        patterns:
          - "next*"
          - "react*"
          - "fastify*"
          - "express*"
          - "hono*"
      auth-and-payments:
        patterns:
          - "@clerk/*"
          - "@stripe/*"
          - "stripe*"
      database-and-messaging:
        patterns:
          - "@prisma/*"
          - "prisma*"
          - "mongoose*"
          - "kafkajs*"
      testing-and-tooling:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "supertest*"
          - "@types/supertest*"
          - "eslint*"
          - "prettier*"
          - "turbo*"
          - "typescript*"

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "docker/*"
          - "pnpm/*"

  # Maintain Docker base images across all microservices
  - package-ecosystem: "docker"
    directory: "/apps/modern-e-commerce"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/apps/product-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/apps/order-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/apps/payment-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/apps/auth-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/apps/email-service"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
