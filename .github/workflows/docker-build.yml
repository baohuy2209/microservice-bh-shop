name: Build & Publish Microservices Containers

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/docker-build.yml"

jobs:
  build-and-push:
    name: Build Container - ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "product-service"
            dockerfile: "apps/product-service/Dockerfile"
          - name: "order-service"
            dockerfile: "apps/order-service/Dockerfile"
          - name: "payment-service"
            dockerfile: "apps/payment-service/Dockerfile"
          - name: "auth-service"
            dockerfile: "apps/auth-service/Dockerfile"
          - name: "email-service"
            dockerfile: "apps/email-service/Dockerfile"
          - name: "modern-e-commerce"
            dockerfile: "apps/modern-e-commerce/Dockerfile"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
